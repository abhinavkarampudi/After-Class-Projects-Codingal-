<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title></title>
    <style>
        body{
            background-color: blue;
            color: white;
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif
        }
        .hero-name{
            font-size: 60px;
            font-weight: bold;
            color: yellow;
            text-shadow: 3px 3px green;
        }
        .tagline{
            font-style: italic ;
            color:red;
            text-transform: capitalize;
        }
        .label{
            text-transform: uppercase;
            text-decoration: underline;
            color:coral;
        }
        .Weakness{
            text-decoration: line-through;
            color:grey;
        }
        .Made-by{
            color: black;
            font-style:oblique;
            transform: rotate(15deg);
        }

    </style>
</head>
<body>
    <h1 class="hero-name">Thunder Kate</h1>
    <p class="tagline">The most powerful hero in the school</p>

    <h2 class="label">Superpowers</h2>
    <p class="power">Can run faster than a cheetah</p>

    <h2 class="label">Weakness</h2>
    <p class="Weakness">Maths homework</p>
    <p class="Weakness">Brocolli</p>
    
    <p class="batch">Top Hero</p>
    <p class="Made-by">Created by Abhinav</p>
</body>
</html>
