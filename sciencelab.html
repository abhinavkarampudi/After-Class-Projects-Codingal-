<!Doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
    <style>
        .jumbotron h1{
            color: red;
        }
        .lead {
            color:darkblue;
        }
        body{
            background-image:linear-gradient(to right,cyan,pink);
        }
        .container{
            background-image: linear-gradient(to right,cyan,yellow,green);
        }
    </style>
</head>
<body>
    <div class="jumbotron jumbotron-fluid">
        <div class="container">
            <h1>My Science Lab</h1>
            <p class="lead">
                Welcome to the lab! Here are the experiments running, the discoveries made, and how far each research project has come.
            </p>
        </div>
    </div>
    <div class="container">
        <p> Chemistry <span class="badge badge-primary">7 experiments</span></p>
        Astronomy<p class="badge badge-danger">5 Experiments</p>
    </div>

    <div class="container">
        <h2 class="section-title">Research progress</h2>
        <p>Chemistry</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-primary " style="width:85%" >
                85 %
            </div>
        </div>
        <div class="progress mb-3">
            <div class="progress-bar bg-success " style="width:90%">
                90 %
            </div>
        </div>
        <div class="progress mb-3">
            <div class="progress-bar bg-danger " style="width:70%">
                70 %
            </div>
        </div>
        
    </div>









</body>
</html>
