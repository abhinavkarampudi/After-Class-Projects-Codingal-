<!DOCTYPE html>
<html>

<head>
    <title>My Animal Safari</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        .safari-slide{
            height: 200px;
            text-align: center;
            padding-top: 75px;
            font-size: 1.8rem;
            color:white;
        }
        .slide-forest{
            background-color: darkgreen;

        }




    </style>
</head>
<body data-spy="scroll" data-target="#safariNav" data-offset="60">
    <div id="safariCarousel" class="carousel slide" data-ride="carousel" >
        <ol class="carousel-indicators">
            <li class="active" data-target="#safariCarousel" data-slide-to="0"></li>
            <li data-target="#safariCarousel" data-slide-to="1"></li>
            <li data-target="#safariCarousel" data-slide-to="2"></li>
            <li data-target="#safariCarousel" data-slide-to="3"></li>
        </ol>
        <div class="carousel-inner">
            <div class="carousel-item active safari-slide slide-forest">
                Forest Safari🫈
            </div>
            <div class="carousel-item safari-slide slide-ocean">
                Ocean Safari🌊
            </div>
            <div class="carousel-item safari-slide slide-desert">
                Desert Safari🏜️
            </div>
        </div>
            <a class="carousel-control-prev" href="#safariCarousel" data-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </a>
            <a class="carousel-control-next" href="#safariCarousel" data-slide="next">
                <span class="carousel-control-next-icon"></span>
            </a>
        
    </div>
    <nav id="safariNav" class="navbar navbar-expand-sm navbar-dark bg-dark sticky-top">

    </nav>
   











</body>
</html>
