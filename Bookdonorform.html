<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Book Donation Form</title>
</head>
<body>
    <h1>📚 Book Donation Form</h1>
    <p>Fill in the form below to donate books to the library!</p>
    <hr>

    <form>

        <fieldset>
            <legend>Donor Details</legend>

            <label>Your Name</label><br>
            <input type="text" id="name" placeholder="Enter your full name"><br><br>

            <label>Donor ID</label><br>
            <input type="password" id="donor-id" placeholder="Enter your donor ID"><br><br>

            <label>Donation Date</label><br>
            <input type="date" id="donation-date"><br>

        </fieldset>

        <br>

        <fieldset>
            <legend>Book Details</legend>

            <label>Choose Book Category</label><br>
            <select id="category">
               <option value="">-- Select a category --</option>
               <option value="Science">Science</option>
               <option value="Fiction">Fiction</option>
               <option value="Mystery">Mystery</option>
               <option value="Romance">Romance</option>
               <option value="Thriller">Thriller</option>
               <option value="Suspense">Suspense</option>
               <option value="Historical Fiction">Historical</option>
               <option value="Fantasy">Fantasy</option>
               <option value="Horror">Horror</option>
               <option value="Contemporary Fiction">Contemporary</option>
               <option value="Literary Fiction">Science</option> 
               <option value="Adventure">Adventure</option>
               <option value="Graphic Novel">Science</option>
               <option value="Mythic Fiction">Science</option>
               <option value="Non-Fiction">Non-fiction</option>
               <option value="Other Genre">Other Genre</option>
            </select><br></br>
            
            <label>If Other Genre chosen Specify</label><br></br>
            <textarea id="notes" rows="3" cols="35" placeholder="e.g. Specify if Other Genre chosen"></textarea><br><br>


            <label>Book Condition</label><br>
            <input type="radio" name="condition" value="new"> Like New<br>
            <input type="radio" name="condition" value="good"> Good<br>
            <input type="radio" name="condition" value="used"> Used<br><br>
            <input type="radio" name="condition" value="Old">Old<br><br>

            <label>Book Title or Additional Notes</label><br>
            <textarea id="notes" rows="3" cols="35" placeholder="e.g. The book title, author name, or any notes."></textarea><br>

        </fieldset>

        <br>

        <fieldset>
            <legend>Preferred Drop-Off Day</legend>

            <input type="checkbox" value="mon"> Monday<br>
            <input type="checkbox" value="tues"> Tuesday<br>
            <input type="checkbox" value="wed"> Wednesday<br>
            <input type="checkbox" value="thurs"> Thursday<br>
            <input type="checkbox" value="fri"> Friday<br>
        </fieldset>
    
        <br>
        <input type="submit" value="Donate My Book">
    </form>
</body>
</html>
