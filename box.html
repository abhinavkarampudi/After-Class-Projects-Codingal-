<!Doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Animal Fact File</title>
    <style>
        body {
            background-color:chocolate;
            font-size: 30px;
        }
        .fact-file{
            background-color: blue;
            width: 100px;
            padding: 80px;
            border: 4px solid forestgreen;
            margin: 30px;
        }
        .detail{
             background-color: white;
            width: 100px;
            padding: 80px;
            border: 4px solid forestgreen;
            margin: 30px;
        }
        .cool-fact{
             background-color: whitesmoke;
            width: 100px;
            padding: 80px;
            border: 4px solid forestgreen;
            margin: 30px;
        }
        .animal-name{
             background-color: whitesmoke;
            width: 100px;
            padding: 80px;
            border: 4px solid forestgreen;
            margin: 30px;
        }
    </style>
</head>
<body>
    <div class="fact-file">
        <h2 class="animal-name">Blue Whale</h2>
        <p class="detail">The Blue Whale is Largest Animal in the World.</p>
        <p class="detail">They are Present in the Sea.</p>
        <p class="detail">They eat Fishes.</p>
        <p class="cool-fact">They are mammals.</p>
    </div>
</body>
</html>
